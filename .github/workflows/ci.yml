name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Restrict default token permissions to least privilege
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Frontend — install, type-check, build, and run tests
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run

  # ─────────────────────────────────────────────────────────────
  # Job 2: Backend Node — install, smoke-check server entry point
  # ─────────────────────────────────────────────────────────────
  backend-node:
    name: Backend Node.js (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/agrisense_test
          JWT_SECRET: ci-test-secret
          ML_SERVICE_URL: http://localhost:8000
          USE_ML_SERVICE: 'false'
          DB_TYPE: mongodb
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # Job 3: Python ML service — install deps and smoke-import check
  # ─────────────────────────────────────────────────────────────
  backend-python:
    name: Python ML Service (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt

      - name: Install Python dependencies
        working-directory: backend/ml
        run: |
          python -m pip install --upgrade pip
          # Install lightweight subset sufficient for import/lint checks
          pip install flask flask-cors numpy scikit-learn joblib requests

      - name: Smoke-import ML service modules
        working-directory: backend/ml
        run: |
          python -c "import flask; import numpy; import sklearn; import joblib; print('Core ML imports OK')"

      - name: Syntax-check all Python files
        working-directory: backend/ml
        run: |
          python -m py_compile ml_service.py
          python -m py_compile predict_crop.py
          python -m py_compile predict_yield.py
          python -m py_compile predict_water.py
          echo "Python syntax checks passed"


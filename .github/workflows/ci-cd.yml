name: AgriOps Unified CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-cbt:
    name: Frontend Continuous Build & Testing (CBT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Build Frontend Assets
        run: npm run build

  backend-ct-cbt:
    name: Backend Continuous Testing & Build (CT/CBT)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: agriops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Database & Run Migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: agriops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        run: |
          python -c "from backend.database.setup import setup_database; setup_database()"

      - name: Run Test Suites
        env:
          PYTHONPATH: .
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: agriops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        run: |
          pytest backend/tests/

  pipeline-ce-cm-cde-cdq-cra:
    name: Continuous Pipelines Verification (CE/CM/CDE/CDQ/CRA)
    runs-on: ubuntu-latest
    needs: backend-ct-cbt
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: agriops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Database Tables
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: agriops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        run: |
          python -c "from backend.database.setup import setup_database; setup_database()"

      - name: Run Pipelines Metrics Verification
        env:
          PYTHONPATH: .
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: agriops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        run: |
          python backend/tests/verify_agriops_pipelines.py

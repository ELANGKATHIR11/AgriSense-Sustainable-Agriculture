[tool.poetry]
name = "agrisense-backend"
version = "0.1.0"
description = "AgriSense backend FastAPI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
psycopg2-binary = "^2.9.9"
lancedb = "^0.8.0"
torch = {version = "^2.4.0", extras = ["cpu"]}
# For CUDA, user must have appropriate torch/cuda wheels; placeholder
onnxruntime-gpu = "^1.19.2"
# Additional deps can be added later

[tool.poetry.dev-dependencies]
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
ruff = "^0.6.7"
mypy = "^1.12.0"
bandit = "^1.7.9"
semgrep = "^1.84.0"
pip-audit = "^2.7.1"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

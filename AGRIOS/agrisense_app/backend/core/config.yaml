plants:
  generic:
    kc: 1.0
    ph_min: 5.5
    ph_max: 8.5
    water_factor: 1.0

defaults:
  area_m2: 100
  moisture_pct: 40
  temperature_c: 25
  ec_dS_m: 1.0

targets_ppm:
  N: 40
  P: 20
  K: 150

rs_per_1000l: 5.0
kwh_per_1000l: 0.9
grid_kgco2_per_kwh: 0.82
pump_lpm: 20.0

# AGRI-OS Decision Governor — crop-specific loss weights
# Higher values = more conservative (favors WAIT/OBSERVE over ACT)
decision_governor:
  default:
    false_positive_act: 0.7
    missed_detection: 0.8
    unnecessary_wait: 0.2
    observe_cost: 0.1
  high_value: # tomato, grape, strawberry
    false_positive_act: 0.9
    missed_detection: 0.9
    unnecessary_wait: 0.15
    observe_cost: 0.05
  staple: # rice, corn, wheat, potato
    false_positive_act: 0.6
    missed_detection: 0.85
    unnecessary_wait: 0.25
    observe_cost: 0.1
